name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (packages, playground and examples)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Check release metadata (no OWNER placeholders, same repository everywhere)
        run: node scripts/check-release.mjs

      - name: Check that the docs images are up to date
        run: |
          for f in docs/examples/*.hpb; do
            n=$(basename "$f" .hpb)
            node packages/cli/dist/cli.js render "$f" -o "docs/images/$n.svg" -q --id-prefix "doc-$n"
          done
          for t in mono dark auto; do
            node packages/cli/dist/cli.js render docs/examples/A-firmware-line.hpb -o "docs/images/A-firmware-line-$t.svg" -q --theme "$t" --id-prefix "doc-A-firmware-line-$t"
          done
          node packages/cli/dist/cli.js render examples/fixtures/A-firmware-line.hpb -o docs/assets/example-a.svg -q --id-prefix example-a
          node packages/cli/dist/cli.js render examples/fixtures/C-hardware-revision.hpb -o docs/assets/example-c.svg -q --id-prefix example-c
          git diff --exit-code -- docs/images docs/assets
